services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: samanvay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-samanvay}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samanvay"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: samanvay_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/samanvay
    ports:
      - "8000:8000"
    volumes:
      - ./data/storage:/app/data/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: samanvay_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/samanvay
    command: ["uv", "run", "python", "-m", "worker.main"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: samanvay_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
