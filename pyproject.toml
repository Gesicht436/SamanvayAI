[project]
name = "samanvayai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gesicht436", email = "186572303+Gesicht436@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".agents", ".venv", "web"]

[tool.ruff.lint]
ignore = ["B008"]



